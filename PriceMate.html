function switchOrderPriceTier(target){
  if(!DATA[target])return false;
  const old=addScheme;
  if(target===old){renderResults();return true}
  const keys=Object.keys(cart).filter(k=>(Number(cart[k])||0)>0);
  if(!keys.length){addScheme=target;renderResults();return true}
  const next={},miss=[];
  const norm=v=>String(v??"").trim().toLowerCase().replace(/\\s+/g," ");
  for(const key of keys){
    const src=rowOf(key);if(!src){miss.push(key);continue}
    const r=src.r;
    let matches=DATA[target].map((x,i)=>({x,i})).filter(z=>
      norm(z.x.code)===norm(r.code)&&norm(z.x.p)===norm(r.p)&&Number(z.x.s)===Number(r.s)&&norm(z.x.c)===norm(r.c));
    if(matches.length!==1)matches=DATA[target].map((x,i)=>({x,i})).filter(z=>
      norm(z.x.code)===norm(r.code)&&norm(z.x.p)===norm(r.p)&&Number(z.x.s)===Number(r.s));
    if(matches.length!==1)matches=DATA[target].map((x,i)=>({x,i})).filter(z=>
      norm(z.x.p)===norm(r.p)&&Number(z.x.s)===Number(r.s)&&norm(z.x.c)===norm(r.c));
    if(matches.length!==1){miss.push(r.p+" · "+pkr(r));continue}
    const dest=matches[0],base=SI[target]+"_"+dest.i;let newKey=base;
    if(src.shade){
      const targetShades=shadesFor(dest.x);
      const shadeMatches=targetShades.map((x,i)=>({x,i})).filter(z=>
        norm(z.x.n)===norm(src.shade.n)&&norm(z.x.c)===norm(src.shade.c));
      const shadeFallback=shadeMatches.length===1?shadeMatches:targetShades.map((x,i)=>({x,i})).filter(z=>norm(z.x.n)===norm(src.shade.n));
      if(shadeFallback.length!==1){miss.push(r.p+" · shade "+src.shade.n);continue}
      newKey=base+"_"+shadeFallback[0].i;
    }
    next[newKey]=(next[newKey]||0)+(Number(cart[key])||0);
  }
  if(miss.length){
    const msg="Tier change cancelled. "+miss.length+" item(s) could not be matched in "+target+". Your current order was kept.";
    toast(msg);return false;
  }
  cart=next;addScheme=target;saveCart();updateBar();updateTab();renderResults();renderLines();
  toast("All order items recalculated at "+target+" prices");return true;
}

<script id="NP_OFFLINE_V2">

 const safeName=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60);
 const panel=$v('npV2Panel'),content=$v('v2Content');
 function open(title,html){$v('v2Title').textContent=title;content.innerHTML=html;panel.hidden=false;document.body.style.overflow='hidden';panel.scrollTop=0}
 function close(){panel.hidden=true;document.body.style.overflow=''}
 function saveOrder(){
  const T=totals();if(!T.lines){toast('Your order is empty');return}

  orders.unshift(entry);if(write(orders.slice(0,500)))toast('Order saved offline · '+id);
 }
 function history(){const orders=read();
  const total=orders.reduce((a,o)=>a+(Number(o.total)||0),0),units=orders.reduce((a,o)=>a+(Number(o.units)||0),0);
  const head=`<div class="v2-stat-grid"><div class="v2-stat"><small>Saved Orders</small><b>${orders.length}</b></div><div class="v2-stat"><small>Total Order Value</small><b>৳${fmt(total)}</b></div><div class="v2-stat"><small>Total Packs</small><b>${units.toLocaleString()}</b></div></div><div class="v2-history-tools"><input class="v2-input" id="v2OrderSearch" placeholder="Search customer, order ID…" aria-label="Search orders"><select class="v2-input" id="v2OrderSort" aria-label="Sort orders"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest value</option><option value="low">Lowest value</option></select></div><div id="v2OrderList"></div>`;

 function renderHistoryList(source){const box=$v('v2OrderList');if(!box)return;let q=($v('v2OrderSearch')?.value||'').trim().toLowerCase(),sort=$v('v2OrderSort')?.value||'new';let a=source.filter(o=>(String(o.label||'')+' '+String(o.customer||'')+' '+String(o.id||'')).toLowerCase().includes(q));a.sort((x,y)=>sort==='old'?new Date(x.date)-new Date(y.date):sort==='high'?(y.total||0)-(x.total||0):sort==='low'?(x.total||0)-(y.total||0):new Date(y.date)-new Date(x.date));

 }
 function backup(){const payload={app:VERSION,created:new Date().toISOString(),priceListVersion:VER,cart,customer:custName(),savedOrders:read()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Nippon_Price_List_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Backup downloaded')}
 function restore(file){const fr=new FileReader();fr.onload=()=>{try{const x=JSON.parse(fr.result);if(!x||typeof x!=='object'||!x.cart||typeof x.cart!=='object')throw Error('Invalid backup');
  if(!confirm('Restore this backup? Your current order will be replaced. Existing saved history will be combined without duplicate IDs.'))return;

 document.addEventListener('click',e=>{

})();

<script id="np-tools-js">
(function(){
 'use strict';
 var PKEY='np_price_patch_oct26_v3';
 var $$=function(id){return document.getElementById(id)};
 var ORIG=JSON.parse(JSON.stringify(DATA));          /* untouched prices, used by "Restore original prices" */
 var DEFAULT_PATCH={"file":"","at":"","ops":{}}; /* Credit-only baseline from the supplied Nov'26 Current Net Price sheet */
 var PATCH=JSON.parse(JSON.stringify(DEFAULT_PATCH)); /* ops: "scheme|rowIndex" -> changed fields */
 try{var p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&p.ops)PATCH=p;else if(p&&p.restored)PATCH={file:'',at:'',ops:{}};else localStorage.setItem(PKEY,JSON.stringify(PATCH))}catch(e){}
 var nops=function(){return Object.keys(PATCH.ops).length};
 function savePatch(){try{localStorage.setItem(PKEY,JSON.stringify(nops()?PATCH:{restored:true}))}catch(e){}}

 /* ---------- apply / restore a price patch on a row ---------- */
 function applyF(r,sch,f){
  if(f.m!=null)r.m=f.m; if(f.t!=null)r.t=f.t;
  if(sch==='Credit'){
   if(f.cp!=null)r.common.price=f.cp; if(f.ci!=null)r.common.inb=f.ci; if(f.camps)r.camps=JSON.parse(JSON.stringify(f.camps));
  }else{
   if(f.price!=null)r.price=f.price; if(f.dsp!=null)r.dsp=f.dsp; if(f.inb!=null)r.inb=f.inb; if(f.cond!==undefined)r.cond=f.cond;
  }
  if(f.ch)r.ch=1;
 }
 function applyAll(){for(var k in PATCH.ops){var a=k.split('|'),L=DATA[a[0]];if(L&&L[+a[1]])applyF(L[+a[1]],a[0],PATCH.ops[k])}}
 function restoreAll(){
  for(var k in PATCH.ops){var a=k.split('|'),L=DATA[a[0]];if(!L||!L[+a[1]])continue;
   var r=L[+a[1]],o=ORIG[a[0]][+a[1]];
   Object.keys(r).forEach(function(x){if(x!=='_i'&&!(x in o))delete r[x]});
   Object.keys(o).forEach(function(x){if(x!=='_i')r[x]=JSON.parse(JSON.stringify(o[x]))});
  }
  PATCH={file:'',at:'',ops:{}};savePatch();
 }
 applyAll();

 /* ---------- helpers ---------- */
 var norm=function(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'')};
 var nrm2=function(s){return String(s==null?'':s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9.]+/g,' ').trim()};
 function num(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  var t=String(v).replace(/[,\s%]|tk|৳/gi,'');if(t==='')return null;var n=Number(t);return isFinite(n)?n:null;
 }
 var sz=function(n){return Math.round(Number(n)*1000)};
 var close=function(a,b,e){return a==null||b==null?a==b:Math.abs(a-b)<=e};

 var HDR={scheme:['scheme','pricescheme','campaign','scheme name'],
  code:['code','itemcode','sapcode','materialcode','material','sku','productcode','item no'],
  product:['product','productname','item','itemname','description','name','material description','prductdescription','productdescription'],
  colour:['colour','color','colours','colors','colourname','shade'],
  size:['size','packsize','pack','packsizel','litre','ltr','l','pack size l','packing'],
  mrp:['mrp','mrptk','mrppack','mrpperpack'],
  td:['td','tradediscount','tradedisc','tradedisc','trade','tradediscountpercent'],
  price:['netprice','price','nprice','net','netpricepack','creditprice','commonprice','cashprice','newprice','netpricetk','invoiceamount','netdealerlanded','netdealerlandedprice'],
  dsp:['dsp','dspprice'],
  inb:['inbill','inb','inbillperl','inbillperlitre','inbilll','inbillrate','inbilldiscounttkltr','inbilldiscounttkperltr']};
 var HMAP={};Object.keys(HDR).forEach(function(k){HDR[k].forEach(function(a){HMAP[norm(a)]=k})});
 function colField(h){
  var n=norm(h);if(HMAP[n])return HMAP[n];
  var m=/^camp(?:aign)?(\d)(cond|condition|price|inbill|inb)$/.exec(n);
  if(m)return 'c'+m[1]+(m[2]==='price'?'p':m[2]==='inbill'||m[2]==='inb'?'i':'c');
  return null;
 }
 var SCH_ALIAS={};
 SCHEMES.forEach(function(s){SCH_ALIAS[norm(s[0])]=s[0];SCH_ALIAS[norm(s[1])]=s[0]});
 Object.assign(SCH_ALIAS,{cashadvance:'Cash Adv',campaign4:'Cash Adv',campaign5:'CR7',campaign6:'SPP20 & CR30',campaign7:'SPP10',spp20:'SPP20 & CR30',cr30:'SPP20 & CR30',spp20cr30:'SPP20 & CR30',cashspp10:'SPP10',cashspp20cr30:'SPP20 & CR30'});

 /* ---------- file readers ---------- */
 async function inflate(u8){
  var ds=new DecompressionStream('deflate-raw');
  var st=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
 }
 async function unzip(buf){
  var u8=new Uint8Array(buf),dv=new DataView(buf),i=u8.length-22;
  for(;i>=0&&dv.getUint32(i,true)!==0x06054b50;i--);
  if(i<0)throw new Error('This is not a valid .xlsx file.');
  var n=dv.getUint16(i+10,true),off=dv.getUint32(i+16,true),files={},td=new TextDecoder();
  for(var k=0;k<n;k++){
   if(dv.getUint32(off,true)!==0x02014b50)break;
   var meth=dv.getUint16(off+10,true),cs=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lo=dv.getUint32(off+42,true);
   var name=td.decode(u8.subarray(off+46,off+46+nl));
   var ln=dv.getUint16(lo+26,true),le=dv.getUint16(lo+28,true),ds=lo+30+ln+le;
   files[name]={meth:meth,data:u8.subarray(ds,ds+cs)};
   off+=46+nl+el+cl;
  }
  return {files:files,read:async function(nm){var f=files[nm];if(!f)return null;var d=f.meth===0?f.data:await inflate(f.data);return td.decode(d)}};
 }
 var xml=function(t){return new DOMParser().parseFromString(t,'application/xml')};
 var colIdx=function(ref){var m=/^([A-Z]+)/.exec(ref||'');if(!m)return 0;var n=0;for(var i=0;i<m[1].length;i++)n=n*26+m[1].charCodeAt(i)-64;return n-1};
 async function readXlsx(buf){
  var z=await unzip(buf),wb=await z.read('xl/workbook.xml');
  if(!wb)throw new Error('No workbook found inside this file.');
  var rels=await z.read('xl/_rels/workbook.xml.rels'),relMap={};
  if(rels)Array.prototype.forEach.call(xml(rels).getElementsByTagName('Relationship'),function(r){relMap[r.getAttribute('Id')]=r.getAttribute('Target')});
  var ss=[],sst=await z.read('xl/sharedStrings.xml');
  if(sst)Array.prototype.forEach.call(xml(sst).getElementsByTagName('si'),function(si){
   var t='';Array.prototype.forEach.call(si.childNodes,function(c){
    if(c.nodeName==='t')t+=c.textContent;
    else if(c.nodeName==='r'){Array.prototype.forEach.call(c.childNodes,function(x){if(x.nodeName==='t')t+=x.textContent})}});
   ss.push(t)});
  var sheets=[],list=Array.prototype.slice.call(xml(wb).getElementsByTagName('sheet'));
  for(var si=0;si<list.length;si++){
   var sh=list[si],rid=sh.getAttribute('r:id'),tg=relMap[rid]||('worksheets/sheet'+(si+1)+'.xml');
   tg=tg.replace(/^\/?(xl\/)?/,'');
   var sx=await z.read('xl/'+tg);if(!sx)continue;
   var rows=[];
   Array.prototype.forEach.call(xml(sx).getElementsByTagName('row'),function(row){
    var arr=[];
    Array.prototype.forEach.call(row.getElementsByTagName('c'),function(c){
     var t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],val=null;
     if(t==='inlineStr'){val=Array.prototype.map.call(c.getElementsByTagName('t'),function(x){return x.textContent}).join('')}
     else if(v){var raw=v.textContent;val=t==='s'?(ss[+raw]||''):t==='str'||t==='e'?raw:t==='b'?raw:Number(raw)}
     arr[colIdx(c.getAttribute('r'))]=val});
    rows.push(arr)});
   sheets.push({name:sh.getAttribute('name'),rows:rows});
  }
  return sheets;
 }
 function readCsv(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'',d=[',','\t',';'].sort(function(a,b){return first.split(b).length-first.split(a).length})[0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
   if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
   else if(c==='"')q=true;
   else if(c===d){row.push(cur);cur=''}
   else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
   else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return [{name:'CSV',rows:rows.map(function(r){return r.map(function(x){return x===''?null:x})})}];
 }

 /* ---------- match sheet rows to price-list rows ---------- */
 var IDX={};
 function index(sch){
  if(IDX[sch])return IDX[sch];var L=DATA[sch],a={},b={};
  L.forEach(function(r,i){
   var s=sz(r.s),c=String(r.code||'').trim().toUpperCase();
   if(c)(a[c+'|'+s]=a[c+'|'+s]||[]).push(i);
   var k=nrm2(r.p)+'|'+nrm2(r.c)+'|'+s;(b[k]=b[k]||[]).push(i);
   var k2=nrm2(r.p)+'||'+s;(b[k2]=b[k2]||[]).push(i)});
  return IDX[sch]={a:a,b:b};
 }
 function match(sch,rec){
  var ix=index(sch),L=DATA[sch],s=sz(rec.size),c=String(rec.code||'').trim().toUpperCase(),prod=nrm2(rec.product),col=nrm2(rec.colour),cand=[];
  if(c)cand=(ix.a[c+'|'+s]||[]).slice();
  if(cand.length>1&&prod){var f=cand.filter(function(i){return nrm2(L[i].p)===prod&&(!col||nrm2(L[i].c)===col)});if(f.length)cand=f}
  if(!cand.length&&prod){
   cand=(ix.b[prod+'|'+col+'|'+s]||[]).slice();
   if(!cand.length&&!col)cand=(ix.b[prod+'||'+s]||[]).slice();
  }
  if(cand.length>1&&rec.mrp!=null){
   var byMrp=cand.filter(function(i){return close(L[i].m,num(rec.mrp),.005)});
   if(byMrp.length)cand=byMrp;
  }
  return cand;
 }
 function resolveScheme(x){
  var n=norm(x);if(SCH_ALIAS[n])return SCH_ALIAS[n];
  if(n.indexOf('credit')>=0)return 'Credit';
  if(n.indexOf('cashadv')>=0||n.indexOf('cashadvance')>=0)return 'Cash Adv';
  if(n.indexOf('cr7')>=0)return 'CR7';
  if(n.indexOf('spp20')>=0||n.indexOf('cr30')>=0)return 'SPP20 & CR30';
  if(n.indexOf('spp10')>=0)return 'SPP10';
  return null;
}
 function curScheme(){return scheme===ORD?(typeof lastScheme!=='undefined'&&DATA[lastScheme]?lastScheme:SCHEMES[0][0]):scheme}


 function analyseCurrentNetPrice(sh,res){
  var rows=sh.rows||[],lastProduct='',lastColour='';
  res.notes.push('Current Net Price sheet detected: imported to Credit tier only. Common price uses DSP; Campaign prices use each campaign DSP. Other four price tiers are unchanged.');
  for(var ri=5;ri<rows.length;ri++){
   var row=rows[ri]||[],product=row[0],size=num(row[2]);
   if(product==null||String(product).trim()===''||size==null)continue;
   product=String(product).trim();
   if(product!==lastProduct){lastProduct=product;lastColour=''}
   if(row[1]!=null&&String(row[1]).trim()!=='')lastColour=String(row[1]).trim();
   var rec={product:product,colour:lastColour,size:size};
   res.rowsRead++;
   var label=product+(lastColour?' · '+lastColour:'')+' '+size;
   var cand=match('Credit',rec);
   if(!cand.length){res.missing.push('Credit · '+label);continue}
   if(cand.length>1){res.ambig.push('Credit · '+label+' ('+cand.length+' rows share it)');continue}
   var i=cand[0],old=DATA.Credit[i],f={};
   var mrp=num(row[3]),td=num(row[4]),ci=num(row[5]),pr=num(row[10]);
   if(td!=null&&td>1)td=td/100;
   if(mrp!=null&&!close(mrp,old.m,.005))f.m=mrp;
   if(td!=null&&!close(td,old.t,.00005))f.t=td;
   if(pr!=null&&!close(pr,old.common.price,.005))f.cp=pr;
   if(ci!=null&&!close(ci,old.common.inb,.005))f.ci=ci;
   var camps=[];
   [[12,13,18],[20,21,26],[28,29,34]].forEach(function(ix){
    var cond=row[ix[0]],inb=num(row[ix[1]]),price=num(row[ix[2]]);
    if(cond!=null&&String(cond).trim()!==''&&price!=null)camps.push({cond:String(cond).trim(),inb:inb,price:price});
   });
   if(camps.length&&JSON.stringify(camps)!==JSON.stringify((old.camps||[]).filter(function(c){return c.price!=null&&c.cond}).map(function(c){return {cond:String(c.cond),inb:c.inb==null?null:c.inb,price:c.price}})))f.camps=camps;
   if(Object.keys(f).length){
    f.ch=1;
    var oldMain=old.common.price,newMain=pr;
    res.changes.push({sch:'Credit',i:i,f:f,label:old.p+(old.c?' · '+old.c:'')+' · '+old.s,old:oldMain,nw:newMain,pc:pr!=null&&!close(pr,old.common.price,.005)});
   }else res.same++;
  }
 }

 function analyseNov26Sheet(sh,sch,res){
  var rows=sh.rows||[],lastProduct='',lastColour='',lastGroup='';
  var credit=sch==='Credit';
  for(var ri=0;ri<rows.length;ri++){
   var row=rows[ri]||[];
   if(row[0]!=null&&String(row[0]).trim()!=='')lastGroup=String(row[0]).trim();
   var product=row[4],size=num(row[6]);
   if(product==null||String(product).trim()===''||size==null)continue;
   product=String(product).trim();
   if(product!==lastProduct){lastProduct=product;lastColour=''}
   if(row[5]!=null&&String(row[5]).trim()!=='')lastColour=String(row[5]).trim();
   var rec={code:lastGroup,product:product,colour:lastColour,size:size,mrp:num(row[7])};
   res.rowsRead++;
   var label=product+(lastColour?' · '+lastColour:'')+' '+size;
   var cand=match(sch,rec);
   if(!cand.length){res.missing.push(sch+' · '+label);continue}
   if(cand.length>1){res.ambig.push(sch+' · '+label+' ('+cand.length+' rows share it)');continue}
   var i=cand[0],old=DATA[sch][i],f={},mrp=num(row[7]),td=num(row[8]);
   if(td!=null&&td>1)td=td/100;
   if(mrp!=null&&!close(mrp,old.m,.005))f.m=mrp;
   if(td!=null&&!close(td,old.t,.00005))f.t=td;
   var oldMain,newMain;
   if(credit){
    oldMain=old.common.price;
    var cp=num(row[15]),ci=num(row[9]);
    if(cp!=null&&!close(cp,old.common.price,.005))f.cp=cp;
    if(ci!=null&&!close(ci,old.common.inb,.005))f.ci=ci;
    var camps=[];
    [[16,17,23],[24,25,31],[32,33,39]].forEach(function(ix){
     var cond=row[ix[0]],inb=num(row[ix[1]]),price=num(row[ix[2]]);
     if(cond!=null&&String(cond).trim()!==''&&price!=null&&price!==0)
      camps.push({cond:String(cond).trim(),inb:inb,price:price});
    });
    var oldCamps=(old.camps||[]).filter(function(c){return c.price!=null&&c.cond}).map(function(c){return {cond:String(c.cond),inb:c.inb==null?null:c.inb,price:c.price}});
    if(JSON.stringify(camps)!==JSON.stringify(oldCamps))f.camps=camps;
    newMain=cp;
   }else{
    oldMain=old.price;
    var price=num(row[18]),dsp=num(row[15]),inb=num(row[10]),cond=row[9];
    if(price!=null&&!close(price,old.price,.005))f.price=price;
    if(dsp!=null&&!close(dsp,old.dsp,.005))f.dsp=dsp;
    if(inb!=null&&!close(inb,old.inb,.005))f.inb=inb;
    if(cond!=null&&String(cond).trim()!==String(old.cond||''))f.cond=String(cond).trim();
    newMain=price;
   }
   var pc=credit?(f.cp!=null):(f.price!=null);
   if(pc||f.camps||f.dsp!=null)f.ch=1;
   if(!Object.keys(f).length){res.same++;continue}
   res.changes.push({sch:sch,i:i,f:f,label:old.p+(old.c?' · '+old.c:'')+' · '+old.s,old:oldMain,nw:newMain,pc:pc});
  }
 }
 function analyse(sheets){
  var res={changes:[],same:0,missing:[],ambig:[],bad:[],notes:[],rowsRead:0};
  var fiveTierMode=sheets.length===5;
  if(fiveTierMode)res.notes.push('Five-sheet workbook detected. Each sheet updates its matching Price Tier only: Credit → C4-Cash Adv → C5-CR7 → C6-SPP20 & CR30 → C7-SPP10. Sheet names may be tier names; otherwise workbook order is used.');
  sheets.forEach(function(sh,si){
   if(!fiveTierMode&&nrm2(sh.name)==='current net price'){analyseCurrentNetPrice(sh,res);return}
   var rows=sh.rows||[],head=rows[3]||[];
   if(resolveScheme(sh.name)&&norm(head[0])==='materialgroup'&&norm(head[6])==='packsize'&&norm(head[4]).indexOf('prductdescription')>=0){
    analyseNov26Sheet(sh,resolveScheme(sh.name),res);return;
   }
   var hi=-1,cols=null;
   for(var i=0;i<Math.min(rows.length,20)&&hi<0;i++){
    var m={},cnt=0;(rows[i]||[]).forEach(function(h,ci){if(h==null)return;var f=colField(h);if(f&&!(f in m)){m[f]=ci;cnt++}});
    if((m.code!=null||m.product!=null)&&(m.price!=null||m.mrp!=null||m.c1p!=null)&&cnt>=3){hi=i;cols=m}
   }
   if(hi<0){res.notes.push('Sheet "'+sh.name+'": no header row found (needs Code or Product, plus Price or MRP). Skipped.');return}
   var defSch=fiveTierMode?(resolveScheme(sh.name)||SCHEMES[si][0]):(resolveScheme(sh.name)||curScheme()),usingCol=!fiveTierMode&&cols.scheme!=null;
   if(!usingCol)res.notes.push('Sheet "'+sh.name+'": no Scheme column, so prices go to '+(resolveScheme(sh.name)?'the scheme named like the sheet':'the scheme you are viewing')+' ('+defSch+').');
   for(var r=hi+1;r<rows.length;r++){
    var row=rows[r]||[];if(!row.some(function(x){return x!=null&&x!==''}))continue;
    var g=function(k){return cols[k]==null?null:row[cols[k]]};
    var rec={code:g('code'),product:g('product'),colour:g('colour'),size:num(g('size'))};
    res.rowsRead++;
    var label=(rec.product||rec.code||'row '+(r+1))+(rec.size!=null?' '+rec.size:'');
    var sch=defSch;
    if(usingCol){sch=resolveScheme(g('scheme'));if(!sch){res.bad.push('Row '+(r+1)+': unknown scheme "'+g('scheme')+'"');continue}}
    if(rec.size==null||(!rec.code&&!rec.product)){res.bad.push('Row '+(r+1)+': needs Pack Size and a Code or Product');continue}
    var cand=match(sch,rec);
    if(!cand.length){res.missing.push(sch+' · '+label);continue}
    if(cand.length>1){res.ambig.push(sch+' · '+label+' ('+cand.length+' rows share it)');continue}
    var i=cand[0],old=DATA[sch][i],f={},mrp=num(g('mrp')),td=num(g('td')),pr=num(g('price')),dsp=num(g('dsp')),inb=num(g('inb'));
    if(td!=null&&td>1)td=td/100;
    if(mrp!=null&&!close(mrp,old.m,.005))f.m=mrp;
    if(td!=null&&!close(td,old.t,.00005))f.t=td;
    var oldMain,newMain=pr;
    if(sch==='Credit'){
     oldMain=old.common.price;
     if(pr!=null&&!close(pr,old.common.price,.005))f.cp=pr;
     if(inb!=null&&inb!==old.common.inb)f.ci=inb;
     var camps=[];for(var n=1;n<=4;n++){var cc=g('c'+n+'c'),cp=num(g('c'+n+'p')),ci=num(g('c'+n+'i'));if(cc!=null&&cc!==''&&cp!=null)camps.push({cond:String(cc).trim(),inb:ci,price:cp})}
     if(camps.length&&JSON.stringify(camps)!==JSON.stringify(old.camps.filter(function(c){return c.price!=null&&c.cond})))f.camps=camps;
    }else{
     oldMain=old.price;
     if(pr!=null&&!close(pr,old.price,.005))f.price=pr;
     if(dsp!=null&&!close(dsp,old.dsp,.005))f.dsp=dsp;
     if(inb!=null&&inb!==old.inb)f.inb=inb;
    }
    var pc=(sch==='Credit'?f.cp:f.price)!=null;
    if(pc||f.camps||f.dsp!=null)f.ch=1;
    if(!Object.keys(f).length){res.same++;continue}
    res.changes.push({sch:sch,i:i,f:f,label:(old.p+(old.c?' · '+old.c:'')+' · '+old.s),old:oldMain,nw:newMain,pc:pc});
   }
  });
  return res;
 }

 /* ---------- UI: modal ---------- */
 var CSS=document.createElement('style');CSS.id='np-tools-css';
 CSS.textContent='.npm-ov{position:fixed;inset:0;z-index:9999;background:rgba(10,18,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}'+

  document.body.appendChild(o);return o;
 }

  var n=nops(),oc=Object.keys(cart).filter(function(k){return cart[k]}).length;

   '<button class="v2-btn npm-opt" data-r="view" type="button">↺ Reset view<small>Back to the first price scheme, All categories, search cleared, "Changed" filter off.</small></button>'+

   if(r==='view'){resetView();closeModal()}
   else if(r==='order'){if(confirm('Clear the current order?')){clearOrder();closeModal()}}

   else if(r==='all'){if(confirm('Reset view, clear the order and restore original prices?')){restoreAll();IDX={};cart={};saveCart();resetView();closeModal();toastMsg('Everything reset')}}});
 }
 function toastMsg(t){var el=$$('toast');if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(toastMsg.t);toastMsg.t=setTimeout(function(){el.hidden=true},2600)}

 /* ---------- Import ---------- */
 var pending=null;
 async function handleFile(file){
  try{
   var name=file.name,sheets;
   if(/\.(csv|tsv|txt)$/i.test(name))sheets=readCsv(await file.text());
   else{
    if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot open .xlsx files offline. Please use the latest Chrome or Edge browser.');
    sheets=await readXlsx(await file.arrayBuffer());
    if(sheets.length!==5){
     var wanted=['Credit','Cash Adv','CR7','SPP20 & CR30','SPP10'],picked={};
     sheets.forEach(function(sh){var sc=resolveScheme(sh.name);if(sc&&!picked[sc])picked[sc]=sh});
     if(wanted.every(function(sc){return !!picked[sc]}))sheets=wanted.map(function(sc){return picked[sc]});
     else throw new Error('Could not identify the five price-tier sheets. Keep exactly these five sheets, or name them with Credit, Cash Adv, CR7, SPP20/CR30 and SPP10.');
    }
   }
   var a=analyse(sheets);pending={file:name,a:a};showPreview();
  }catch(err){
   modal('📥 Import new prices','<p><b>Could not read that file.</b></p><p class="npm-muted">'+esc(err.message||String(err))+'</p>','<button class="v2-btn" type="button" data-x="1">OK</button>');
  }
 }
 function showPreview(){
  var a=pending.a,pcs=a.changes.filter(function(c){return c.pc}).length;
  var list=function(arr,max){return arr.slice(0,max).map(function(x){return '<div>'+esc(x)+'</div>'}).join('')+(arr.length>max?'<div class="npm-muted">…and '+(arr.length-max)+' more</div>':'')};
  var body='<p><b>'+esc(pending.file)+'</b></p><div class="npm-stats"><div><b>'+a.rowsRead+'</b><span>rows read</span></div><div><b>'+a.changes.length+'</b><span>items to update</span></div><div><b>'+a.same+'</b><span>already same</span></div><div><b>'+(a.missing.length+a.ambig.length+a.bad.length)+'</b><span>skipped</span></div></div>';
  if(a.notes.length)body+='<p class="npm-muted">'+a.notes.map(esc).join('<br>')+'</p>';
  if(a.changes.length)body+='<p><b>Changes</b> ('+pcs+' with a new price)</p><div class="npm-list">'+a.changes.slice(0,40).map(function(c){
    var arrow=c.pc&&c.old!=null&&c.nw!=null?' <span class="'+(c.nw>c.old?'npm-up':'npm-dn')+'">'+fmt(c.old)+' → '+fmt(c.nw)+'</span>':' <span class="npm-muted">other fields</span>';
    return '<div>'+esc(c.sch)+' · '+esc(c.label)+arrow+'</div>'}).join('')+(a.changes.length>40?'<div class="npm-muted">…and '+(a.changes.length-40)+' more</div>':'')+'</div>';
  else body+='<p>No price differences found in this file.</p>';
  if(a.missing.length)body+='<p><b>Not found in the price list</b></p><div class="npm-list">'+list(a.missing,12)+'</div>';
  if(a.ambig.length)body+='<p><b>Ambiguous (skipped)</b> <small>Add the Product and Colour columns to tell them apart.</small></p><div class="npm-list">'+list(a.ambig,8)+'</div>';
  if(a.bad.length)body+='<p><b>Unreadable rows</b></p><div class="npm-list">'+list(a.bad,8)+'</div>';
  body+='<p class="npm-muted">Applied prices are kept on this device. Use Reset → Restore original prices to undo.</p>';
  var acts=(a.changes.length?'<button class="v2-btn primary" type="button" data-apply="1">✔ Apply '+a.changes.length+' update'+(a.changes.length===1?'':'s')+'</button>':'')+'<button class="v2-btn" type="button" data-x="1">Cancel</button>';
  var o=modal('📥 Import new prices',body,acts);
  o.addEventListener('click',function(e){if(e.target.closest('[data-apply]'))applyImport()});
 }
 function applyImport(){
  var a=pending.a;
  a.changes.forEach(function(c){var k=c.sch+'|'+c.i;PATCH.ops[k]=Object.assign(PATCH.ops[k]||{},c.f);applyF(DATA[c.sch][c.i],c.sch,c.f)});
  PATCH.file=pending.file;PATCH.at=new Date().toISOString();savePatch();IDX={};
  var n=a.changes.length;pending=null;closeModal();draw();toastMsg(n+' item'+(n===1?'':'s')+' updated from file');
 }
 function downloadTemplate(){
  var H=['Scheme','Code','Product','Colour','Pack Size','MRP','TD %','Net Price','DSP','In-Bill'];
  for(var n=1;n<=3;n++)H.push('Camp'+n+' Cond','Camp'+n+' Price','Camp'+n+' In-Bill');
  var out=[H],cv=function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  SCHEMES.forEach(function(S){DATA[S[0]].forEach(function(r){
   var cr=S[0]==='Credit',row=[S[0],r.code||'',r.p,r.c||'',r.s,r.m,Math.round((r.t||0)*10000)/100,cr?r.common.price:r.price,cr?'':r.dsp,cr?r.common.inb:r.inb];
   var cs=cr?(r.camps||[]).filter(function(c){return c.price!=null&&c.cond}):[];
   for(var n=0;n<3;n++){var c=cs[n];row.push(c?c.cond:'',c?c.price:'',c?c.inb:'')}
   out.push(row)})});
  var blob=new Blob(['﻿'+out.map(function(r){return r.map(cv).join(',')}).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Net_Price_Template.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
 }
 function openImport(){
  var o=modal('📥 Import new prices',
   '<p>Choose one <b>.xlsx</b> workbook containing the <b>5 price-tier sheets</b>. If the workbook has extra sheets, the module will automatically pick the matching Credit, Cash Adv, CR7, SPP20 &amp; CR30, and SPP10 sheets. Otherwise it uses this order: <b>1 Credit, 2 C4-Cash Adv, 3 C5-CR7, 4 C6-SPP20 &amp; CR30, 5 C7-SPP10</b>. If sheet names match these tiers, the importer also recognizes them by name.</p>'+
   '<p><b>Columns</b> (header row can be within the first 20 rows, any order): <b>Code</b> or <b>Product</b>, <b>Colour</b> (if applicable), <b>Pack Size</b>, then applicable price fields: <b>MRP</b>, <b>TD %</b>, <b>Net Price</b>, <b>DSP</b>, <b>In-Bill</b>. Credit sheet can additionally include <b>Camp1 Cond / Camp1 Price / Camp1 In-Bill</b> (up to 4 campaigns).</p>'+
   '<p>Rows are matched by Code + Pack Size, or by Product + Colour + Pack Size. Blank cells leave that value unchanged.</p>'+
   (nops()?'<p class="npm-muted">Currently applied: '+nops()+' updated item'+(nops()===1?'':'s')+(PATCH.file?' from '+esc(PATCH.file):'')+'.</p>':''),
   '<button class="v2-btn primary" type="button" data-pick="1">📂 Choose file</button><button class="v2-btn" type="button" data-tpl="1">⬇ Download template</button>');
  o.addEventListener('click',function(e){if(e.target.closest('[data-pick]'))$$('npImpFile').click();if(e.target.closest('[data-tpl]'))downloadTemplate()});
 }

 /* ---------- expose importer for the side navigation ---------- */
 window.npOpenPriceUpdate = openImport;

 /* ---------- wire buttons ---------- */
 var bar=$$('npV2Tools');
 if(bar){
  bar.insertAdjacentHTML('afterbegin','<button class="v2-btn" id="npHome" type="button">🏠 Home</button>');
  var anchor=$$('v2File')||null,html='<button class="v2-btn" id="npImport" type="button">📥 Price Update (XLSX)</button><button class="v2-btn" id="npReset" type="button">↺ Reset</button><input id="npImpFile" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>';
  if(anchor)anchor.insertAdjacentHTML('beforebegin',html);else bar.insertAdjacentHTML('beforeend',html);
 }
 var h1=document.querySelector('.top h1');
 if(h1)h1.insertAdjacentHTML('beforeend','<button class="v2-btn np-home-top" id="npHome2" type="button" aria-label="Home">🏠 Home</button>');
 document.addEventListener('click',function(e){
  if(e.target.closest('#npHome')||e.target.closest('#npHome2'))goHome();
  else if(e.target.closest('#npReset'))openReset();
  else if(e.target.closest('#npImport'))openImport();
 });
 var fi=$$('npImpFile');
 if(fi)fi.addEventListener('change',function(){var f=fi.files&&fi.files[0];fi.value='';if(f)handleFile(f)});

 /* badge when imported prices are active */
 var baseDraw=draw;
 draw=function(){baseDraw.apply(this,arguments);
  var b=$$('npPatchBadge'),c=$$('count');
  if(nops()&&c){if(!b){b=document.createElement('span');b.id='npPatchBadge';c.parentNode.insertBefore(b,c.nextSibling)}b.textContent='Prices updated'+(PATCH.file?' · '+PATCH.file:'');b.title=PATCH.at?('Imported '+PATCH.at):''}
  else if(b)b.remove();
 };
 draw();
})();

<script id="np-advanced-addon">
(()=>{
 'use strict';
 const $=id=>document.getElementById(id), panel=$('npAdvancedPanel'), body=$('npAdvBody');
 const PROFILE_KEY='np_dealer_profile_v1', ORDER_KEY='np_saved_orders_v2';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>'৳ '+(Number(n)||0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2});
 const readProfile=()=>{try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(_){return {}}};
 const readOrders=()=>{try{const x=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return []}};
 function open(title,html){$('npAdvTitle').textContent=title;body.innerHTML=html;panel.hidden=false;document.body.style.overflow='hidden'}
 function close(){panel.hidden=true;document.body.style.overflow=''}
 function csv(){const rows=[...document.querySelectorAll('#ob .sap-table tbody tr')];if(!rows.length){alert('There are no order items to export.');return}const data=[['Material Code','Product Description','Shade','Order Qty','Unit','Pack Size','ATP Qty','Amount (BDT)']];for(const tr of rows){const td=tr.querySelectorAll('td');if(td.length<8)continue;data.push([td[0].innerText,td[1].innerText.replace(/\s+/g,' ').trim(),td[2].innerText,td[3].querySelector('input')?.value||td[3].innerText,td[4].innerText,td[5].innerText,td[6].innerText,td[7].innerText.replace(/,/g,'')])}const csvText='\uFEFF'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csvText],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Nippon_Order_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);if(typeof toast==='function')toast('Order CSV exported')}
 $('npExportCsvBtn')?.addEventListener('click',csv);
 $('npAdvClose').addEventListener('click',close);panel.addEventListener('click',e=>{if(e.target===panel)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()});
 body.addEventListener('click',e=>{if(e.target.id==='npDealerSave'){const d={name:$('npDealerName').value.trim(),code:$('npDealerCode').value.trim(),contact:$('npDealerContact').value.trim(),mobile:$('npDealerMobile').value.trim(),area:$('npDealerArea').value.trim(),address:$('npDealerAddress').value.trim(),notes:$('npDealerNotes').value.trim()};try{localStorage.setItem(PROFILE_KEY,JSON.stringify(d));if(typeof toast==='function')toast('Dealer profile saved')}catch(_){alert('Could not save dealer profile. Browser storage may be full.')}close()}if(e.target.id==='npDealerClear'){if(confirm('Clear the saved dealer profile from this device?')){localStorage.removeItem(PROFILE_KEY);profile()}}});
})();

<script id="np-v25-shade-pack-entry">
(()=>{
 'use strict';
 const baseRenderResults=renderResults;
 renderResults=function(){
   // Open the shade chooser automatically for every matching shade-enabled product.
   baseRenderResults();
   const host=$("ores");
   if(!host)return;
   [...host.querySelectorAll(":scope > .row.rs")].forEach(card=>{
     const toggle=card.querySelector(".shade-toggle");
     const pane=card.querySelector(".shade-pane");
     if(toggle&&pane&&pane.hidden)toggle.click();
   });
   // Rebuild the compact result table from the current result cards.
   if(host.querySelector(".ob-results-table"))return;
   const cards=[...host.querySelectorAll(":scope > .row.rs")];
   if(!cards.length)return;
   const table=document.createElement("div");
   table.className="ob-results-table";
   const head=document.createElement("div");
   head.className="ob-results-head";
   head.innerHTML="<span>PRD (PRODUCT)</span><span>PACK SIZE</span><span>SHADE OR BASE</span><span>QTY</span>";
   table.appendChild(head);
   cards.forEach(card=>{
     const product=card.querySelector(".pack")?.textContent?.trim()||"Product";
     const price=card.querySelector(".price")?.textContent?.trim()||"";
     const meta=card.querySelector(".sub2:not(.r)")?.textContent?.trim()||"";
     const packMatch=meta.match(/([0-9]+(?:\\.[0-9]+)?\\s*(?:L|KG|G|ML|LTR)?)(?:\\s*pack)/i);
     const pack=packMatch?packMatch[1].replace(/\\s+/g,""):"";
     const rowKey=card.dataset.base||"";
     const source=rowOf(rowKey);
     const shadeBox=card.querySelector(".shade-box");
     const qtyBox=card.querySelector(".qty");
     const row=document.createElement("div");
     row.className="ob-results-row";
     row.dataset.base=rowKey;
     const productCell=document.createElement("div");
     productCell.className="ob-r-product";
     const b=document.createElement("b");b.textContent=product;
     const sm=document.createElement("small");sm.textContent=price?("Unit price "+price):"";
     productCell.append(b,sm);
     const packCell=document.createElement("div");packCell.className="ob-r-pack";
     const packInput=document.createElement("input");
     packInput.type="number";packInput.min="0";packInput.step="any";
     packInput.inputMode="decimal";packInput.value=source?String(source.r.s):pack.replace(/[^0-9.]/g,"");
     packInput.className="ob-pack-input";
     packInput.setAttribute("aria-label","Pack size for "+product);
     packInput.dataset.product=product;
     packInput.dataset.base=rowKey;
     const unit=document.createElement("span");unit.className="pack-unit";unit.textContent=pack.replace(/[0-9.]/g,"")||"Pack";
     packCell.append(packInput,unit);
     const shadeCell=document.createElement("div");shadeCell.className="ob-r-shade";
     const base=meta.split("·")[0].trim();
     if(base&&base!=="—"){const baseEl=document.createElement("div");baseEl.className="ob-r-base";baseEl.textContent=base;shadeCell.appendChild(baseEl)}
     const qtyCell=document.createElement("div");qtyCell.className="ob-r-qty";
     if(shadeBox){
       shadeCell.appendChild(shadeBox);
       const note=document.createElement("div");note.className="ob-shade-qty-note";note.textContent="Enter quantity beside each selected shade";
       qtyCell.appendChild(note);
     }else if(qtyBox){qtyCell.appendChild(qtyBox)}
     row.append(productCell,packCell,shadeCell,qtyCell);
     table.appendChild(row);
     card.remove();
   });
   host.prepend(table);
 };
 // A manually entered pack size must match a real price-list pack for the same product.
 $("list").addEventListener("change",e=>{
   const input=e.target.closest(".ob-pack-input");
   if(!input)return;
   const old=rowOf(input.dataset.base);
   if(!old){input.setCustomValidity("Product variant not found.");input.reportValidity();return}
   const wanted=Number(input.value);
   if(!Number.isFinite(wanted)||wanted<=0){input.setCustomValidity("Enter a valid pack size.");input.reportValidity();return}
   const rows=DATA[addScheme]||[];
   const norm=v=>String(v??"").trim().toLowerCase();
   const matches=rows.map((r,i)=>({r,i})).filter(x=>
     norm(x.r.p)===norm(old.r.p) &&
     norm(x.r.code)===norm(old.r.code) &&
     norm(x.r.c)===norm(old.r.c) &&
     Math.abs(Number(x.r.s)-wanted)<0.0001
   );
   if(matches.length!==1){
     input.setCustomValidity("This pack size is not available for this product in the selected price scheme.");
     input.reportValidity();
     input.value=String(old.r.s);
     input.setCustomValidity("");
     return;
   }
   // Narrow the search to the chosen product and pack so the matching price-list row is shown.
   oq=old.r.p+" "+wanted;
   const search=$("os");if(search)search.value=oq;
   renderResults();
 });
 if(typeof scheme!=="undefined"&&scheme===ORD)renderOrderTab();
})();
</script>

<script id="np26-js">
(()=>{
'use strict';
const SAVED_KEY='np_saved_orders_v2';
const packSel={};
const gk=r=>r.p+'|'+(r.c||'');
const setCust=v=>{try{localStorage.setItem('inv_cust',v)}catch(e){}};
const lastSaved=()=>{try{const a=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');return Array.isArray(a)&&a.length?a[0]:null}catch(e){return null}};

/* ---------- A. Customer field in Order Builder + Repeat last order ---------- */
const _renderOrderTab=renderOrderTab;
renderOrderTab=function(){
  _renderOrderTab();
  const ws=document.querySelector('.np-order-workspace');
  if(ws&&!$('npCust')){
    const head=ws.querySelector('.np-order-head');
    const box=document.createElement('div');box.className='np26-cust';
    box.innerHTML='<label>Customer / Shop<input id="npCust" type="text" placeholder="Customer or shop name (shown on invoice)" autocomplete="off"></label><button type="button" class="btn" id="npRepeat">↻ Repeat last order</button>';
    head.after(box);
  }
  const c=$('npCust');if(c&&document.activeElement!==c)c.value=custName();
  const rp=$('npRepeat');if(rp)rp.hidden=!lastSaved();
};
document.addEventListener('input',e=>{if(e.target&&e.target.id==='npCust')setCust(e.target.value)});
document.addEventListener('click',e=>{
  const b=e.target.closest('#npRepeat');if(!b)return;
  const o=lastSaved();if(!o){toast('No saved order yet');return}
  if(Object.keys(cart).length&&!confirm('Replace the current order with your last saved order?'))return;
  cart=JSON.parse(JSON.stringify(o.cart||{}));saveCart();if(o.customer)setCust(o.customer);
  draw();toast('Last saved order loaded');
});

/* ---------- B. Search results: one card per product, pack chips, shades collapsed ---------- */
renderResults=function(){
  const el=$('ores');if(!el)return;
  const toks=NPS.tokens(oq);NPS.sugRender($('ossug'),oq,'os');
  const detect=$('npSearchDetect');
  if(detect){
    if(!toks.length)detect.textContent='Search product name, pack size, material code, shade name or shade code';
    else{
      const raw=NPS.norm(oq),cmp=raw.replace(/\s/g,''),rows=DATA[addScheme]||[],labels=[];
      if(cmp.length>=4&&rows.some(r=>r.code&&NPS.norm(r.code).includes(cmp)))labels.push('Material code');
      if(toks.some(t=>t.num!=null))labels.push('Pack size');
      labels.push('Product / shade');
      detect.innerHTML='<b>Search detected:</b> '+labels.map(esc).join(' · ');
    }
  }
  if(!toks.length){el.innerHTML='';return}
  shadeState.clear();
  const L=DATA[addScheme];
  const cand=NPS.find(L,toks,true,(r,m)=>{const sl=shadesFor(r);let sidx=null;
    if(m.miss.length){if(!sl.length)return null;sidx=[];sl.forEach((sh,j)=>{if(NPS.textHasAll(sh.n+' '+(sh.c||''),m.miss))sidx.push(j)});if(!sidx.length)return null}

const _switchTier=switchOrderPriceTier;

    rail.addEventListener('click',e=>{const b=e.target.closest('.np-rc');if(!b||scheme!==ORD)return;
      if(sel.value!==b.dataset.t){sel.value=b.dataset.t;sel.dispatchEvent(new Event('change'))}});

      else b.innerHTML=sv+esc(t)}
    busy=false;
  }
  new MutationObserver(iconize).observe(document.body,{subtree:true,childList:true,characterData:true});

<script id="np-v37-js">
(function(){

 const _rl=renderLines;
 renderLines=function(){
  _rl();
  document.querySelectorAll('#ob .np26-grp').forEach(g=>{
   const rows=[...g.querySelectorAll('.np26-ln')];if(!rows.length)return;
   const t=document.createElement('table');t.className='np37-tbl';
   t.innerHTML='<thead><tr><th>Shade / Item</th><th class="c">Qty</th><th class="r">Amount</th><th></th></tr></thead>';
   const tb=document.createElement('tbody');
   rows.forEach(r=>{const tr=document.createElement('tr');
    const mk=(cls,el)=>{const td=document.createElement('td');if(cls)td.className=cls;td.appendChild(el);tr.appendChild(td)};
    mk('',r.querySelector('.np26-ln-n'));mk('c',r.querySelector('.np26-qty'));mk('r',r.querySelector('.np26-amt'));mk('c',r.querySelector('.sap-del'));
    tb.appendChild(tr);r.remove()});
   t.appendChild(tb);g.insertBefore(t,g.querySelector('.np26-sub'));
  });
 };
 try{renderLines()}catch(e){}
 /* back arrow on every search bar */
 const ARROW='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>';
 function addBack(inp){
  if(inp.dataset.np37)return;inp.dataset.np37='1';
  const par=inp.parentElement;if(!par)return;
  if(getComputedStyle(par).position==='static')par.style.position='relative';
  par.classList.add('np37-has');
  const b=document.createElement('button');b.type='button';b.className='np37-back';b.setAttribute('aria-label','Back');b.title='Back';b.innerHTML=ARROW;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();
   if(inp.value){inp.value='';inp.dispatchEvent(new Event('input',{bubbles:true}))}
   inp.blur();
   window.scrollTo({top:0,behavior:'smooth'});});
  par.insertBefore(b,inp);
 }
 function scan(){document.querySelectorAll('#q,#os,#ndQ,.shade-search,.shade-filter,input[type=search]').forEach(addBack)}

 /* ---- Order summary as one SAP-style table ---- */
 renderLines=function(){

  const used=SCHEMES.filter(s=>T.by[s[0]]);
  let n=0,first=true,h='<div class="np41-wrap">';
  for(const s of used){
   const L=T.by[s[0]],S=T.sub[s[0]],ad=ADJ[s[0]];
   h+=`<div class="np41-sec"><div class="np41-band"><span>Scheme: ${esc(s[1])}${n===0?'<small class="np48-cnt"> · '+T.lines+(T.lines===1?' item':' items')+'</small>':''}</span><b>Tk ${fmt(S.land)}</b></div>`;

     <td class="r c-rate np41-rate-d">${fmt(x.t.p)}${x.t.tier?'<small>'+esc(x.t.tier)+'</small>':''}</td>

<script id="np45-sidebar-js">
(function(){
 'use strict';
 var $$=function(id){return document.getElementById(id)};
 var svg=function(d){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>'};
 var ICON={
  dash:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  check:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  sale:'<path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/>',
  arrow:'<path d="M9 5l7 7-7 7"/>'};
 var tiers=SCHEMES.map(function(s){return s});

 /* build DOM */
 var edge=document.createElement('div');edge.id='np45Edge';
 var tab=document.createElement('button');tab.id='np45Tab';tab.type='button';tab.setAttribute('aria-label','Open menu');tab.innerHTML=svg(ICON.arrow);
 var shade=document.createElement('div');shade.id='np45Shade';
 var side=document.createElement('nav');side.id='np45Side';side.setAttribute('aria-label','Sale menu');
 side.innerHTML=
  '<button type="button" class="np45-i" data-act="dash">'+svg(ICON.dash)+'Dashboard</button>'+
  '<button type="button" class="np45-i" data-act="check">'+svg(ICON.check)+'Check Prices</button>'+
  '<button type="button" class="np45-i" data-act="price-update">'+svg(ICON.card)+'Price Update (XLSX)</button>'+
  '<button type="button" class="np45-i" data-act="sale">'+svg(ICON.sale)+'New Sale</button>'+
  '<hr><div class="np45-h">Price tier</div>'+
  tiers.map(function(s){return '<button type="button" class="np45-i" data-tier="'+esc(s[0])+'">'+svg(ICON.card)+esc(s[1])+'</button>'}).join('');
 document.body.appendChild(shade);document.body.appendChild(edge);document.body.appendChild(tab);document.body.appendChild(side);

 /* open / close (auto-hide) */
 var closeT=null;
 function open(){clearTimeout(closeT);document.body.classList.add('np45-open')}
 function close(){clearTimeout(closeT);document.body.classList.remove('np45-open')}
 function softClose(){clearTimeout(closeT);closeT=setTimeout(close,350)}
 var hover=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
 if(hover){
  edge.addEventListener('mouseenter',open);tab.addEventListener('mouseenter',open);
  side.addEventListener('mouseenter',function(){clearTimeout(closeT)});
  side.addEventListener('mouseleave',softClose);
 }
 tab.addEventListener('click',function(){document.body.classList.contains('np45-open')?close():open()});
 shade.addEventListener('click',close);
 document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});

 /* actions */
 function dashOpen(){var d=$$('npDash');return !!(d&&!d.hidden)}
 function goSale(){
  close();
  var d=$$('npDash');
  if(d&&!d.hidden){d.hidden=true;document.body.style.overflow='';window.scrollTo(0,0)}
  sync();
 }
 function openDash(focusSearch){
  close();
  var fresh=!dashOpen();
  if(fresh&&typeof window.npOpenDashboard==='function')window.npOpenDashboard();
  else if(!focusSearch){var h=$$('ndHome');if(h)h.click()}
  if(focusSearch){
   var d=$$('npDash');
   var b=d&&d.querySelector('.nd-sap-tabs button[data-t="'+(typeof addScheme!=='undefined'?addScheme:'')+'"]');
   if(b&&fresh)b.click();
   setTimeout(function(){var q=$$('ndQ');if(q)q.focus()},80);
  }
 }
 side.addEventListener('click',function(e){
  var b=e.target.closest('.np45-i');if(!b)return;
  if(b.dataset.act==='sale'){goSale();return}
  if(b.dataset.act==='dash'){openDash(false);return}
  if(b.dataset.act==='check'){openDash(true);return}
  if(b.dataset.act==='price-update'){close();if(typeof window.npOpenPriceUpdate==='function')window.npOpenPriceUpdate();else console.error('Price Update module is not ready.');return}
  var t=b.dataset.tier;
  if(t&&dashOpen()){
   var tb=$$('npDash').querySelector('.nd-sap-tabs button[data-t="'+t+'"]');
   if(tb)tb.click();
   close();mark();return;
  }
  if(t){
   var ok=true;
   if(typeof switchOrderPriceTier==='function')ok=switchOrderPriceTier(t);
   if(ok!==false){
    var s=$$('npPriceTier');if(s)s.value=t;
    var s2=$$('npTierSel');if(s2)s2.value=t;
    try{drawAddChips()}catch(_){}
    mark();
   }
   close();
  }
 });

 /* highlight the active tier */
 function mark(){
  var cur=typeof addScheme!=='undefined'?addScheme:'';
  var d=$$('npDash');
  if(d&&!d.hidden){var sb=d.querySelector('.nd-sap-tabs button[aria-selected="true"]');if(sb)cur=sb.dataset.t}
  var sale=side.querySelector('[data-act="sale"]');
  if(sale){if(d&&!d.hidden)sale.removeAttribute('aria-current');else sale.setAttribute('aria-current','true')}
  side.querySelectorAll('[data-tier]').forEach(function(b){
   if(b.dataset.tier===cur)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');
  });
 }

 /* visible only in the New Sale (Order) module */
 function sync(){
  var dash=$$('npDash'),inv=$$('inv'),pn=$$('npV2Panel');
  var inOrder=(typeof scheme!=='undefined'&&scheme===ORD);
  var dashOn=!!(dash&&!dash.hidden);
  var blocked=(inv&&!inv.hidden)||(pn&&!pn.hidden)||!!$$('npModal');
  var on=(inOrder||dashOn)&&!blocked;
  document.body.classList.toggle('np45-on',on);
  if(!on)close();
  mark();
 }
 setInterval(sync,300);
 document.addEventListener('click',function(){setTimeout(sync,60)},true);
 sync();
})();
</script>

<script id="np46-js">
(function(){
 'use strict';
 var $=function(id){return document.getElementById(id)};
 var QC=[1,2,5,10];

 /* Customer / shop name: always CAPITAL LETTERS while typing (New Sale box and invoice box) */
 document.addEventListener('input',function(e){
  var t=e.target;if(!(t&&(t.id==='npCust'||t.id==='invc')))return;
  var a=t.selectionStart,b=t.selectionEnd,u=t.value.toUpperCase();
  if(u!==t.value){t.value=u;try{t.setSelectionRange(a,b)}catch(_){}}
 },true);

 /* Enter in a qty box -> back to the search box, text selected, ready for the next product */
 document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(!(t&&t.matches&&t.matches('#list input.qi')))return;
  e.preventDefault();t.blur();
  var os=$('os');if(os){os.focus();try{os.select()}catch(_){}try{os.scrollIntoView({block:'nearest'})}catch(_){}}
 },true);

 /* Quick qty chips under each product's qty box */
 function addChips(){
  document.querySelectorAll('#list .np26-card .qty').forEach(function(q){
   var n=q.nextElementSibling;if(n&&n.classList.contains('np46-qc'))return;
   var i=q.querySelector('input.qi');if(!i)return;
   var d=document.createElement('div');d.className='np46-qc';
   d.innerHTML=QC.map(function(v){return '<button type="button" data-q="'+v+'" data-k="'+i.dataset.k+'">'+v+'</button>'}).join('');
   q.after(d);
  });
 }
 document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.np46-qc button');if(!b)return;
  e.preventDefault();setQty(b.dataset.k,+b.dataset.q);
 });

 /* Already in order notice */
 document.addEventListener('focusin',function(e){
  var t=e.target;if(!(t&&t.matches&&t.matches('#list input.qi')))return;
  var q=cart[t.dataset.k]||0;if(q>0)toast('Already in order ('+q+'). Change the number to update it.');
 },true);

 /* Remove with Undo (no confirm popup) */
 var undoT,undoSnap=null;
 function hideUndo(){var u=$('np46Undo');if(u)u.remove();clearTimeout(undoT);undoSnap=null}
 function showUndo(){var o=$('np46Undo');if(o)o.remove();var d=document.createElement('div');d.id='np46Undo';
  d.innerHTML='<span>Item removed</span><button type="button" id="np46UndoBtn">Undo</button>';document.body.appendChild(d);
  clearTimeout(undoT);undoT=setTimeout(hideUndo,7000)}
 document.addEventListener('click',function(e){
  var d=e.target.closest&&e.target.closest('[data-sap-del]');
  if(d){e.preventDefault();e.stopImmediatePropagation();undoSnap=JSON.stringify(cart);setQty(d.dataset.sapDel,0);showUndo();return}
  if(e.target.closest&&e.target.closest('#np46UndoBtn')&&undoSnap){
   cart=JSON.parse(undoSnap);saveCart();updateBar();updateTab();renderLines();hideUndo();toast('Item restored')}
 },true);

 /* Copy preview: see (and edit) the text, then Copy */
 function copyText(txt,done){
  var fb=function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();done(ok)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true)},fb);else fb();
 }
 function closePreview(){var w=$('np46Prev');if(w)w.remove()}
 function showPreview(txt){
  closePreview();var w=document.createElement('div');w.id='np46Prev';
  w.innerHTML='<div class="np46-box" role="dialog" aria-label="Copy preview"><b>Copy preview</b><textarea spellcheck="false"></textarea><div class="np46-acts"><button type="button" class="btn pri" id="np46Copy">Copy</button><button type="button" class="btn" id="np46Close">Close</button></div></div>';
  document.body.appendChild(w);var ta=w.querySelector('textarea');ta.value=txt;
  w.addEventListener('click',function(e){
   if(e.target===w||e.target.id==='np46Close'){closePreview();return}
   if(e.target.id==='np46Copy')copyText(ta.value,function(ok){toast(ok?'Order copied':'Could not copy. Take a screenshot instead.');if(ok)closePreview()});
  });
 }
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closePreview()});
 copyOrder=function(){syncPendingQty();var T=totals();if(!T.lines){toast('Order is empty');return}showPreview(copyOrderText())};

 /* After "Repeat last order": mark products that were not in that order */
 var RK='np46_repeat';
 function getRep(){try{var a=JSON.parse(localStorage.getItem(RK)||'null');return Array.isArray(a)?new Set(a):null}catch(_){return null}}
 function setRep(a){try{if(a)localStorage.setItem(RK,JSON.stringify(a));else localStorage.removeItem(RK)}catch(_){}}
 document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('[data-v2-load]')){setRep(null);return}
  if(!(e.target.closest&&e.target.closest('#npRepeat')))return;
  var before=JSON.stringify(cart);
  setTimeout(function(){if(JSON.stringify(cart)!==before)setRep(Object.keys(cart));markNew()},0);
 },true);
 function markNew(){
  var rep=getRep();if(rep&&!Object.keys(cart).length){setRep(null);rep=null}
  var ob=$('ob');if(!ob)return;
  ob.querySelectorAll('input[data-sap-qty]').forEach(function(i){
   var host=i.closest('tr')||i.closest('.np26-ln');if(!host)return;
   var isNew=!!rep&&!rep.has(i.dataset.sapQty),tag=host.querySelector('.np46-badge');
   host.classList.toggle('np46-new',isNew);
   if(isNew&&!tag){var c=host.querySelector('.c-item b,.np26-ln-n b')||host.querySelector('b');if(c)c.insertAdjacentHTML('afterend','<span class="np46-badge">NEW</span>')}
   else if(!isNew&&tag)tag.remove();
  });
 }
 var raf=0;
 new MutationObserver(function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;addChips();markNew()})}).observe(document.body,{childList:true,subtree:true});
 addChips();markNew();
})();
</script>

<script id="np47-js">
(function(){
 'use strict';
 var $=function(id){return document.getElementById(id)};
 var LABEL={'Credit':'Credit','Cash Adv':'C4-Cash Adv','CR7':'C5-CR7','SPP20 & CR30':'C6-SPP20 & CR30','SPP10':'C7-SPP10'};
 var HUE={'Credit':'#2563eb','Cash Adv':'#16a34a','CR7':'#7c3aed','SPP20 & CR30':'#ea580c','SPP10':'#0d9488'};
 var catSel='All';
 function ls(k){try{return localStorage.getItem(k)}catch(_){return null}}
 function lset(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){}}
 function jget(k){try{var a=JSON.parse(ls(k)||'[]');return Array.isArray(a)?a:[]}catch(_){return[]}}

 /* Price tier: keep the original dropdown in the New Sale customer bar. */

 /* 2. Recent customers on the Customer / Shop boxes */
 function custList(){return jget('np47_custs')}
 function seedCusts(){
  if(ls('np47_custs')!==null)return;var a=[];
  try{if(typeof SAVED_KEY!=='undefined'){JSON.parse(ls(SAVED_KEY)||'[]').forEach(function(o){var n=String((o&&o.customer)||'').trim().toUpperCase();if(n&&a.indexOf(n)<0)a.push(n)})}}catch(_){}
  lset('np47_custs',JSON.stringify(a.slice(0,40)));
 }
 function fillCust(){
  var dl=$('np47CustList');if(!dl){dl=document.createElement('datalist');dl.id='np47CustList';document.body.appendChild(dl)}
  var h=custList().map(function(n){return '<option value="'+esc(n)+'"></option>'}).join('');if(dl.innerHTML!==h)dl.innerHTML=h;
  ['npCust','invc'].forEach(function(id){var el=$(id);if(el&&el.getAttribute('list')!=='np47CustList')el.setAttribute('list','np47CustList')});
 }
 document.addEventListener('change',function(e){
  var t=e.target;if(!t||(t.id!=='npCust'&&t.id!=='invc'))return;
  var v=String(t.value).trim().toUpperCase();if(!v)return;
  var a=custList().filter(function(x){return x!==v});a.unshift(v);lset('np47_custs',JSON.stringify(a.slice(0,40)));fillCust();
 });

 /* 3. Category chips (filter the search) */
 var catOn=null,_find=NPS.find;
 NPS.find=function(){var r=_find.apply(this,arguments);return(catOn&&Array.isArray(r))?r.filter(function(c){return c.r&&c.r.g===catOn}):r};
 function ensureCat(){
  var c=document.querySelector('.np-order-controls');if(!c)return;var b=$('np47Cat');
  if(!b){b=document.createElement('div');b.id='np47Cat';b.setAttribute('role','group');b.setAttribute('aria-label','Product category');
   b.innerHTML=CATS.map(function(k){return '<button type="button" data-c="'+esc(k)+'">'+esc(CATLABEL[k]||k)+'</button>'}).join('');c.after(b)}
  b.querySelectorAll('button').forEach(function(x){var on=String(x.dataset.c===catSel);if(x.getAttribute('aria-pressed')!==on)x.setAttribute('aria-pressed',on)});
 }
 document.addEventListener('click',function(e){
  var cb=e.target.closest&&e.target.closest('#np47Cat button');
  if(cb){catSel=cb.dataset.c;ensureCat();renderResults();return}
  var nb=e.target.closest&&e.target.closest('.np47-bc button');
  if(nb){var os=$('os');if(os){os.value=nb.dataset.n;os.dispatchEvent(new Event('input',{bubbles:true}))}}
 });

 /* 4. Recent products + category product list when the search box is empty */
 function recent(){return jget('np47_recent')}
 var _sq=setQty;
 setQty=function(k,v,f){
  var r=_sq.apply(this,arguments);
  try{if((cart[k]||0)>0){var o=rowOf(k);if(o){var a=recent().filter(function(x){return x!==o.r.p});a.unshift(o.r.p);lset('np47_recent',JSON.stringify(a.slice(0,12)))}}}catch(_){}
  return r;
 };
 var _rr=renderResults;
 renderResults=function(){
  catOn=catSel!=='All'?catSel:null;
  try{_rr.apply(this,arguments)}finally{catOn=null}
  var el=$('ores');if(!el||NPS.tokens(oq).length)return;
  var L=DATA[addScheme]||[],names=[],title='';
  if(catSel!=='All'){var seen={};L.forEach(function(r){if(r.g===catSel&&!seen[r.p]){seen[r.p]=1;names.push(r.p)}});title=(CATLABEL[catSel]||catSel)+' products'}
  else{names=recent().filter(function(n){return L.some(function(r){return r.p===n})}).slice(0,10);title='Recent products'}
  if(!names.length)return;
  el.innerHTML='<div class="np47-br"><div class="np47-bt">'+esc(title)+'</div><div class="np47-bc">'+names.map(function(n){return '<button type="button" data-n="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div></div>';
 };

 var raf=0;
 function pass(){ensureCat();fillCust()}
 new MutationObserver(function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;pass()})}).observe(document.body,{childList:true,subtree:true});
 lset('np47_note',null);seedCusts();pass();
})();
</script>

.pm-brand{display:flex;align-items:center;gap:9px;min-width:0}
.priceai-mark{display:inline-flex;width:34px;height:34px;flex:none}
.priceai-mark svg{width:100%;height:100%;display:block}
.pm-brand-name{font:800 18px/1 var(--display);letter-spacing:-.03em;color:var(--fg);white-space:nowrap}
.pm-brand-tag{font:600 11px/1.3 var(--body);color:var(--muted);text-align:right}
</style>
<style id="np48-css">
/* ===== v48: blinking period tag, compact order table, one-bar actions ===== */
.pm-brandbar{flex-wrap:nowrap}
.pm-brand-tag{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0;flex:0 1 auto;text-align:right}
.pm-tag-txt{text-align:right;white-space:nowrap}
.pm-live{display:inline-block;max-width:100%;padding:4px 10px 4px 11px;border-radius:10px 10px 3px 10px;background:linear-gradient(135deg,#ffb300 0%,#ff7a00 55%,#f2480a 100%);color:#fff;font:800 9.5px/1.3 var(--body);letter-spacing:0;text-align:right;text-shadow:0 1px 1px rgba(120,40,0,.45);box-shadow:0 2px 8px rgba(242,100,10,.38),inset 0 1px 0 rgba(255,255,255,.35);white-space:nowrap}

/* compact order table */
.np41-wrap .np41-band{padding:5px 8px;font-size:11.5px}
.np41-wrap .np41-tbl{font-size:11.5px}
.np41-wrap .np41-tbl th{padding:3px 2px;font-size:9px}
.np41-wrap .np41-tbl td{padding:3px 2px;line-height:1.2}
.np41-wrap .np41-tbl .c-item b{font-size:12px;line-height:1.2}
.np41-wrap .np41-tbl .c-item small{font-size:10px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np41-wrap .np41-tbl .c-no{font-size:10px;padding-left:4px}
.np41-wrap .np41-tbl td.c-pack{font-size:11.5px}
.np41-wrap .np41-tbl th.c-pack{font-size:9px}
.np41-wrap .np41-tbl .c-amt{font-size:12px;padding-right:2px}
.np41-wrap .np41-q{gap:1px}
.np41-wrap .np41-q .qb{width:20px;height:24px;font-size:14px;border-radius:5px}
.np41-wrap .np41-qi{width:28px;height:24px;font-size:12px;border-radius:5px}
.np41-wrap .c-x .sap-del{width:20px;height:20px;font-size:10px;border-radius:5px}
.np41-wrap .np41-tot{padding:2px 8px 4px}
.np41-wrap .np41-tot>div{padding:2px 0;font-size:11.5px}
.np41-wrap .np41-tot>.val{font-size:13px;padding-top:4px}
.np41-grand{padding:7px 10px;font-size:13px}
@media(min-width:700px){.np41-wrap .np41-qi{width:40px}.np41-wrap .np41-tbl{font-size:12.5px}}

/* Review & Invoice | Copy Order | Clear All in one bar */
.np48-bar{display:grid;grid-template-columns:1.25fr 1fr 1fr;width:100%;margin:10px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.np48-bar .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:56px;margin:0;padding:8px 4px;border:0;border-radius:0;background:transparent;color:var(--fg);font:700 11.5px/1.15 var(--body);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:none}
.np48-bar .btn+.btn{border-left:1px solid var(--line)}
.np48-bar .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.np48-bar .btn span{display:block;max-width:100%}
.np48-bar .btn:active{background:var(--accent-soft)}
.np48-bar .js-inv{background:var(--accent);color:var(--accent-fg,#fff)}
.np48-bar .js-inv:active{background:var(--accent);filter:brightness(.92)}
.np48-bar .js-copy{color:var(--accent)}
.np48-bar .js-clear{color:#dc2626}
@media print{.np48-bar{display:none}}
</style>
<style id="np48b-css">
/* order table: item & shade on one line, qty box only */
.np41-wrap .np41-tbl .c-item b{display:inline!important}
.np41-wrap .np41-tbl .np48-sh{display:inline;margin-left:5px;padding-left:5px;border-left:2px solid var(--accent);font:700 11px var(--body);color:var(--accent)}
.np41-wrap .np41-tbl .np48-cnt{font-weight:600;opacity:.8}
.np41-wrap .np41-qi{width:46px;height:26px;font-size:13px;font-weight:800}
.np41-wrap .np41-q{justify-content:center}
/* Save Order + Home inside the PriceMate bar */
body.np48-merged .top{display:none!important}
#list .pm-brandbar.np48-m{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand acts" "tag tag";align-items:center;gap:6px 8px;padding:8px 10px;margin:0 0 8px}
#list .pm-brandbar.np48-m .pm-brand{grid-area:brand}
#list .pm-brandbar.np48-m .pm-actions{grid-area:acts;display:flex;gap:6px;align-items:center}
#list .pm-brandbar.np48-m .pm-brand-tag{grid-area:tag;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;text-align:left;padding-top:6px;border-top:1px solid var(--line)}
#list .pm-brandbar.np48-m .pm-tag-txt{text-align:left}
#list .pm-brandbar.np48-m .pm-live{margin-left:auto}
.pm-actions .pm-act{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 12px var(--body);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pm-actions .pm-act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pm-actions .pm-save{background:var(--accent);color:var(--accent-fg,#fff);border-color:var(--accent)}
.pm-actions .pm-act:active{filter:brightness(.92)}
@media(max-width:400px){.pm-actions .pm-home span{display:none}.pm-actions .pm-home{padding:0 9px}}
@media print{.pm-actions{display:none}}
</style>
<script id="np48-js">
(function(){
 'use strict';
 var SAVE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>';
 var HOME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
 function merge(){
  var bar=document.querySelector('#list .pm-brandbar');
  var on=false;
  if(bar&&document.getElementById('v2Save')&&document.getElementById('npHome2')){
   if(!bar.classList.contains('np48-m'))bar.classList.add('np48-m');
   if(!bar.querySelector('.pm-actions')){
    var box=document.createElement('div');box.className='pm-actions';
    box.innerHTML='<button type="button" class="pm-act pm-save" data-relay="v2Save" title="Save this order">'+SAVE+'<span>Save Order</span></button><button type="button" class="pm-act pm-home" data-relay="npHome2" aria-label="Home" title="Home">'+HOME+'<span>Home</span></button>';
    bar.querySelector('.pm-brand').after(box);
   }
   on=true;
  }
  var sale=false;try{sale=(scheme===ORD)}catch(_){sale=true}
  document.body.classList.toggle('np48-merged',on&&sale);
 }
 document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-relay]');if(b){e.preventDefault();var el=document.getElementById(b.dataset.relay);if(el)el.click()}});
 var raf=0;
 new MutationObserver(function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;merge()})}).observe(document.body,{childList:true,subtree:true});
 merge();
})();
</script>

<script id="pricemate-pwa-registration">
// Register the offline app shell when served from HTTPS or localhost.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(err => console.warn('PriceMate offline setup could not be registered:', err));
  });
}
</script>
